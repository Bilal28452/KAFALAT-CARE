{% extends "core/base.html" %}
{% block title %}Password Updated - KafalatCare{% endblock %}
{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-8 col-lg-6 col-xl-5">
    <div class="card border-0 shadow-sm"><div class="card-body p-4 p-md-5 text-center">
      <div class="display-5 text-success mb-3"><i class="bi bi-shield-check"></i></div>
      <h1 class="h3 mb-3">Password updated</h1>
      <p class="text-muted">Your password has been changed. Sign in with your new password.</p>
      <a class="btn btn-success mt-2" href="{% url 'login' %}">Sign in</a>
    </div></div>
  </div>
</div>
{% endblock %}
