{% load static %}
<aside class="admin-sidebar" data-admin-sidebar>
  <div class="sidebar-brand">
    <img src="{% static 'images/KC.png' %}" alt="KafalatCare">
    <div class="sidebar-brand-text">Kafalat<span>Care</span></div>
  </div>

  <ul class="sidebar-nav">
    {% for item in nav_items %}
    <li>
      {% if item.subitems %}
      <div class="sidebar-toggle d-flex justify-content-between align-items-center w-100 p-2 {% if item.is_active %}active{% endif %}" 
           data-bs-toggle="collapse" 
           data-bs-target="#sidebar-submenu-{{ item.id }}" 
           aria-expanded="{% if item.is_active %}true{% else %}false{% endif %}"
           style="cursor: pointer;">
        <span><i class="{{ item.icon }}"></i> {{ item.label }}</span>
        <i class="bi bi-chevron-down"></i>
      </div>
          <div class="collapse {% if item.is_active %}show{% endif %}" id="sidebar-submenu-{{ item.id }}">
        <ul class="submenu list-unstyled ps-3 mb-0">
            {% for sub in item.subitems %}
            <li>
                <a href="{{ sub.url }}" class="d-block py-2 submenu-link {% if request.path == sub.url %}active-submenu{% endif %}" 
                  onclick="event.stopPropagation();">
                    <i class="{{ sub.icon }} me-2"></i> {{ sub.label }}
                </a>
            </li>
            {% endfor %}
        </ul>
      </div>
      {% else %}
      <a href="{{ item.url|default:request.path }}" class="sidebar-link d-block p-2 {% if active_section == item.id %}active{% endif %}">
        <i class="{{ item.icon }}"></i> {{ item.label }}
      </a>
      {% endif %}
    </li>
    {% endfor %}
    <li><a href="{% url 'logout' %}" class="sidebar-link d-block p-2"><i class="bi bi-box-arrow-left"></i> Logout</a></li>
  </ul>
</aside>
