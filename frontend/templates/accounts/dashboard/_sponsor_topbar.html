<header class="admin-topbar">
  <div class="d-flex align-items-center gap-3"><button class="btn btn-outline-success mobile-sidebar-toggle" type="button" data-sidebar-toggle aria-label="Toggle sidebar"><i class="bi bi-list"></i></button><h1 class="topbar-title">{{ page_title }}</h1></div>
  <div class="topbar-actions">
    <a class="btn btn-outline-success btn-sm" href="{% url 'notification_list' %}" aria-label="Notifications{% if unread_notification_count %}, {{ unread_notification_count }} unread{% endif %}"><i class="bi bi-bell"></i><span class="d-none d-md-inline ms-1">Notifications</span>{% if unread_notification_count %}<span class="badge rounded-pill bg-danger ms-1">{{ unread_notification_count }}</span>{% endif %}</a>
    <a class="btn btn-outline-success btn-sm" href="{% url 'sponsor_message_inbox' %}" aria-label="Messages{% if unread_message_count %}, {{ unread_message_count }} unread{% endif %}"><i class="bi bi-chat-dots"></i><span class="d-none d-md-inline ms-1">Messages</span>{% if unread_message_count %}<span class="badge rounded-pill bg-danger ms-1">{{ unread_message_count }}</span>{% endif %}</a>
    <button type="button" class="theme-toggle-btn" id="theme-toggle-btn" title="Toggle Dark Mode"><i class="bi bi-moon-fill"></i></button>
    <div class="dropdown"><div class="user-chip dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false" style="cursor:pointer;"><div class="user-avatar">{{ user_initials }}</div><div class="d-none d-sm-block"><div class="fw-bold">{{ sponsor_name }}</div><small class="text-muted">Sponsor</small></div></div>
      <ul class="dropdown-menu dropdown-menu-end"><li><a class="dropdown-item" href="{% url 'sponsor_profile' %}"><i class="bi bi-person-circle me-2"></i>My Profile</a></li><li><a class="dropdown-item" href="{% url 'sponsor_change_password' %}"><i class="bi bi-key me-2"></i>Change Password</a></li><li><hr class="dropdown-divider"></li><li><a class="dropdown-item" href="{% url 'sponsor_logout' %}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a></li></ul>
    </div>
  </div>
</header>
